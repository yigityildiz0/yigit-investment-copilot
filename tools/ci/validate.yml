name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skill structure, links, privacy markers and syntax
        run: python tools/build_release.py --check
      - name: Byte-compile every script
        run: python -m compileall -q skill tools
      - name: Offline smoke tests
        run: |
          python skill/yigit-investment-copilot/modules/trade-management-exits/scripts/trade_plan.py --entry 100 --atr 3 --capital 100000
          python skill/yigit-investment-copilot/modules/quant-research-lab/scripts/cost_model.py --price 50 --order-try 100000 --adv-try 50000000 --capacity
          python skill/yigit-investment-copilot/modules/probabilistic-market-forecast/scripts/forecast_ranges.py --current-price 100 --annualized-vol 0.4 --horizon-days 90 --target-price 115
