name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skill structure, links, privacy markers, commands, marketplace and syntax
        run: python tools/build_release.py --check
      - name: Byte-compile every script
        run: python -m compileall -q skill tools tests
      - name: Offline regression tests (synthetic data, no network)
        run: python tests/run_tests.py
