name: Validate current downloads
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_downloads.py
      - run: python tools/build_release.py --check
      - run: python tests/run_tests.py
