name: Validate current download artifacts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_current.py
